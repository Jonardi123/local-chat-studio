services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: sudon-searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-this-local-secret}
    ports:
      - "8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
